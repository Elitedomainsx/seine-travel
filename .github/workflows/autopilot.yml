name: Search Console editorial export

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/autopilot.yml
      - autopilot/gsc_editorial_export.py
      - autopilot/gsc_portfolio_export.py
  schedule:
    - cron: "17 2 * * 1,4" # Monday/Thursday UTC, ahead of the Argentina 05:00 editorial task

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
      GSC_SITE_URL: sc-domain:seine.travel

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export Seine Search Console data
        run: python -m autopilot.gsc_editorial_export

      - name: Export portfolio Search Console data
        run: python -m autopilot.gsc_portfolio_export

      - name: Update readable calendar CSVs
        run: |
          if [ -n "$(git status --porcelain -- data/gsc_latest.csv data/search-console)" ]; then
            git config user.name "portfolio-gsc-export"
            git config user.email "portfolio-gsc-export@users.noreply.github.com"
            git add data/gsc_latest.csv data/search-console
            git commit -m "data: refresh Search Console editorial queries"
            git push
          fi

      - name: Save editorial exports
        uses: actions/upload-artifact@v4
        with:
          name: search-console-editorial-${{ github.run_id }}
          path: |
            gsc-editorial-export/
            gsc-portfolio-export/
          if-no-files-found: error
          retention-days: 60
