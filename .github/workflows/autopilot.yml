name: Seine Search Console editorial export

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/autopilot.yml
  schedule:
    - cron: "17 2 * * 1,4" # Monday/Thursday UTC, ahead of the Argentina morning calendar

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
      GSC_SITE_URL: sc-domain:seine.travel

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export editorial Search Console data
        run: python -m autopilot.gsc_editorial_export

      - name: Update existing calendar CSV
        run: |
          if [ -n "$(git status --porcelain -- data/gsc_latest.csv)" ]; then
            git config user.name "seine-gsc-export"
            git config user.email "seine-gsc-export@users.noreply.github.com"
            git add data/gsc_latest.csv
            git commit -m "data: refresh Seine Search Console queries"
            git push
          fi

      - name: Save editorial export
        uses: actions/upload-artifact@v4
        with:
          name: seine-gsc-editorial-${{ github.run_id }}
          path: gsc-editorial-export/
          if-no-files-found: error
          retention-days: 60
